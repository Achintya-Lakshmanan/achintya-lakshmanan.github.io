    <script>
      (function () {
        // The page is paper by default; the night page is a choice, remembered.
        var theme = 'light'
        try { theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light' } catch (e) {}
        document.documentElement.dataset.theme = theme
        // "Skip the room" is remembered too, and applied before the first paint so the layout does not jump.
        try { if (localStorage.getItem('room') === 'off') document.documentElement.classList.add('plain') } catch (e) {}
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0A0C10')
      })()
    </script>
